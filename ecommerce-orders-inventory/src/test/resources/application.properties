# Integration tests run against a SEPARATE, disposable database so they
# never touch or wipe your development data (some tests call deleteAll()).
# Create it once with: CREATE DATABASE ecommerce_db_test;
# See README "Running the tests".
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.main.banner-mode=off

logging.level.root=WARN
logging.level.com.example.ecommerce=INFO
