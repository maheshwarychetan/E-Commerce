spring.application.name=ecommerce-orders-inventory

# ---- Database connection ----
# Override any of these with real environment variables (DB_URL, DB_USERNAME,
# DB_PASSWORD) instead of editing this file - see README "Configuration".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.default_schema=ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# "update" is convenient for local development (Hibernate creates/updates
# tables from the entities automatically). A production system would use a
# real migration tool (Flyway/Liquibase) with ddl-auto=validate instead -
# see README "Database Migrations".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---- Logging ----
logging.level.root=INFO
logging.level.com.example.ecommerce=DEBUG
logging.level.org.hibernate.SQL=WARN

# This is a console app - keep Spring Boot's own banner out of the way.
spring.main.banner-mode=off
